<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <title>OG image – źródło (1200×630)</title>
  <!-- Źródło grafiki social (assets/img/og-image.png). Render: otwórz w Chromium w oknie 1200×630 i zrób zrzut ekranu. -->
  <link rel="stylesheet" href="../assets/css/styles.css">
  <style>
    html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
    body { position: relative; padding: 0; background: var(--ivory); }
    *, *::before, *::after { animation: none !important; }
    .og-bg { position: absolute; inset: 0; background:
      radial-gradient(52rem 34rem at 92% -10%, rgba(232,191,179,.85), transparent 62%),
      radial-gradient(40rem 30rem at -8% 108%, rgba(183,200,181,.7), transparent 62%); }
    .og-copy { position: absolute; left: 80px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; width: 640px; }
    .og-kicker { color: var(--rose); font-size: 22px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
    .og-name { margin: 18px 0 0; font-family: var(--font-display); font-weight: 400; font-size: 132px; line-height: .94; letter-spacing: -.03em; }
    .og-name span { display: block; }
    .og-name span + span { color: var(--forest-2); padding-left: .1em; }
    .og-meta { margin-top: 34px; color: var(--ink-soft); font-size: 26px; font-weight: 600; }
    .og-art { position: absolute; right: 70px; top: 40px; height: 590px; width: 456px; }
    .og-art svg { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div class="og-bg"></div>
  <div class="og-copy">
    <div class="og-kicker">Kwiaciarnia w Gdyni</div>
    <div class="og-name"><span>Wiecha</span><span>Kwiatów</span></div>
    <div class="og-meta">ul. Legionów 107K/2U · +48 726 560 460</div>
  </div>
  <div class="og-art"><svg viewBox="0 0 480 620" xmlns="http://www.w3.org/2000/svg" focusable="false">
            <defs>
              <linearGradient id="g-arch" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#ecc4b8"/>
                <stop offset=".55" stop-color="#f3dfd6"/>
                <stop offset="1" stop-color="#d3e0d0"/>
              </linearGradient>
              <radialGradient id="g-sun" cx=".5" cy=".5" r=".5">
                <stop offset="0" stop-color="#e3a77f" stop-opacity=".85"/>
                <stop offset="1" stop-color="#e3a77f" stop-opacity=".25"/>
              </radialGradient>
              <linearGradient id="g-fade" x1="0" y1="0" x2="0" y2="1">
                <stop offset=".35" stop-color="#d3e0d0" stop-opacity="0"/>
                <stop offset="1" stop-color="#d3e0d0" stop-opacity="1"/>
              </linearGradient>
              <clipPath id="c-arch">
                <path id="arch-d" d="M24 620V250C24 126 122 28 240 28s216 98 216 222v370z"/>
              </clipPath>

              <path id="leaf" d="M0 0C16-24 52-28 78-10 56 12 22 20 0 0z"/>

              <g id="bloom">
                <g class="pt1">
                  <ellipse cx="0" cy="-33" rx="15" ry="31"/>
                  <ellipse cx="0" cy="-33" rx="15" ry="31" transform="rotate(45)"/>
                  <ellipse cx="0" cy="-33" rx="15" ry="31" transform="rotate(90)"/>
                  <ellipse cx="0" cy="-33" rx="15" ry="31" transform="rotate(135)"/>
                  <ellipse cx="0" cy="-33" rx="15" ry="31" transform="rotate(180)"/>
                  <ellipse cx="0" cy="-33" rx="15" ry="31" transform="rotate(225)"/>
                  <ellipse cx="0" cy="-33" rx="15" ry="31" transform="rotate(270)"/>
                  <ellipse cx="0" cy="-33" rx="15" ry="31" transform="rotate(315)"/>
                </g>
                <g class="pt2">
                  <ellipse cx="0" cy="-22" rx="10" ry="21" transform="rotate(22.5)"/>
                  <ellipse cx="0" cy="-22" rx="10" ry="21" transform="rotate(67.5)"/>
                  <ellipse cx="0" cy="-22" rx="10" ry="21" transform="rotate(112.5)"/>
                  <ellipse cx="0" cy="-22" rx="10" ry="21" transform="rotate(157.5)"/>
                  <ellipse cx="0" cy="-22" rx="10" ry="21" transform="rotate(202.5)"/>
                  <ellipse cx="0" cy="-22" rx="10" ry="21" transform="rotate(247.5)"/>
                  <ellipse cx="0" cy="-22" rx="10" ry="21" transform="rotate(292.5)"/>
                  <ellipse cx="0" cy="-22" rx="10" ry="21" transform="rotate(337.5)"/>
                </g>
                <circle class="ptc" r="11"/>
                <circle class="ptd" r="4"/>
              </g>

              <g id="poppy">
                <g class="pt1">
                  <circle cx="0" cy="-22" r="23"/>
                  <circle cx="21" cy="-7" r="23"/>
                  <circle cx="13" cy="18" r="23"/>
                  <circle cx="-13" cy="18" r="23"/>
                  <circle cx="-21" cy="-7" r="23"/>
                </g>
                <circle class="pt2" r="15"/>
                <circle class="ptc" r="7"/>
              </g>

              <path id="bud" d="M0 0C-22-10-26-44 0-74 26-44 22-10 0 0z"/>
            </defs>

            <!-- obrys przesunięty (linia) -->
            <use href="#arch-d" transform="translate(18 -16)" fill="none" stroke="#1f3329" stroke-opacity=".22" stroke-width="1.2"/>

            <g class="art-frame">
              <use href="#arch-d" fill="url(#g-arch)"/>

              <g clip-path="url(#c-arch)">
                <circle cx="352" cy="178" r="66" fill="url(#g-sun)"/>
                <circle cx="352" cy="178" r="88" fill="none" stroke="#c58a64" stroke-opacity=".35" stroke-width="1"/>

                <!-- lewy bukiet -->
                <g class="art-sway art-sway--b">
                  <path class="stem" d="M232 640C214 540 160 440 140 330"/>
                  <use href="#leaf" class="leaf" transform="translate(205 520) rotate(-150) scale(.95)"/>
                  <use href="#leaf" class="leaf leaf--sage" transform="translate(168 430) rotate(-20) scale(.8)"/>
                  <use href="#bloom" class="bl bl--blush" transform="translate(140 314) rotate(12) scale(.92)"/>
                </g>

                <!-- prawy bukiet -->
                <g class="art-sway art-sway--c">
                  <path class="stem" d="M248 640C274 540 332 468 352 352"/>
                  <use href="#leaf" class="leaf leaf--sage" transform="translate(284 520) rotate(-30) scale(1)"/>
                  <use href="#leaf" class="leaf" transform="translate(326 430) rotate(-165) scale(.8)"/>
                  <use href="#bloom" class="bl bl--cream" transform="translate(352 336) rotate(-8) scale(.88)"/>
                </g>

                <!-- boczne -->
                <g class="art-sway">
                  <path class="stem" d="M226 640C196 580 126 540 92 482"/>
                  <use href="#leaf" class="leaf" transform="translate(150 548) rotate(-168) scale(.8)"/>
                  <use href="#poppy" class="bl bl--clay" transform="translate(90 462) rotate(-14) scale(.78)"/>
                </g>
                <g class="art-sway art-sway--b">
                  <path class="stem" d="M252 640C292 590 382 556 404 496"/>
                  <use href="#leaf" class="leaf leaf--sage" transform="translate(330 574) rotate(-20) scale(.75)"/>
                  <use href="#bud" class="bl bl--rose" transform="translate(404 500) rotate(14) scale(.8)"/>
                </g>

                <!-- centralna, największa -->
                <g class="art-sway art-sway--c">
                  <path class="stem" d="M240 640C238 540 252 420 238 232"/>
                  <use href="#leaf" class="leaf" transform="translate(240 540) rotate(-160) scale(1.15)"/>
                  <use href="#leaf" class="leaf leaf--sage" transform="translate(245 470) rotate(-18) scale(1.05)"/>
                  <use href="#leaf" class="leaf" transform="translate(242 380) rotate(-155) scale(.9)"/>
                  <use href="#bloom" class="bl bl--rose" transform="translate(238 196) rotate(6) scale(1.18)"/>
                </g>

                <!-- wstążka spinająca bukiet + wyciszenie łodyg ku dołowi -->
                <path d="M222 574c-14 6-30 22-34 40 14-2 28-14 34-26zM258 574c14 6 30 22 34 40-14-2-28-14-34-26z" fill="#82314a"/>
                <rect x="210" y="562" width="60" height="20" rx="10" fill="#9a3d58"/>
                <circle cx="240" cy="572" r="8" fill="#82314a"/>
                <rect x="0" y="560" width="480" height="70" fill="url(#g-fade)"/>
              </g>
            </g>
          </svg></div>
</body>
</html>
